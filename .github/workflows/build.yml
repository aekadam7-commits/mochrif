name: Build Ghiyabat APK and EXE
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source archive
        shell: bash
        run: |
          ZIP=""
          for f in school-app-source.zip source.zip app-source.zip ghiyabat-source.zip; do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done
          if [ -z "$ZIP" ]; then
            for f in *.zip; do
              [ -f "$f" ] || continue
              case "$f" in *QR*|*qr*) continue ;; esac
              ZIP="$f"
              break
            done
          fi
          if [ -z "$ZIP" ]; then
            echo "No source zip found — using repo tree as-is."
            exit 0
          fi
          echo "Extracting $ZIP ..."
          rm -rf _src
          mkdir _src
          unzip -oq "$ZIP" -d _src
          # عدد العناصر في المستوى الأول
          n=$(find _src -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          only=""
          for d in _src/*/; do
            [ -d "$d" ] || continue
            if [ -z "$only" ]; then only="${d%/}"; else only="__multi__"; break; fi
          done
          if [ "$only" = "__multi__" ]; then only=""; fi
          if [ "$n" = "1" ] && [ -n "$only" ] && [ -d "$only" ]; then
            SRC="$only"
            echo "Nested folder detected: $SRC"
          else
            SRC="_src"
            echo "Flat archive"
          fi
          # نسخ الملفات إلى جذر العمل دون المساس بـ .github
          find "$SRC" -mindepth 1 -maxdepth 1 ! -name '.github' ! -name '.git' -print0 | while IFS= read -r -d '' item; do
            base=$(basename "$item")
            rm -rf "./$base"
            mv "$item" "./$base"
          done
          rm -rf _src
          echo "Source extracted. Root contents:"
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject repo for auto QR
        run: node tools/inject-repo.js
        env:
          REPO: ${{ github.repository }}

      - name: Prepare desktop project
        run: node tools/prepare-desktop.js

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ghiyabat-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source archive
        run: |
          ZIP=""
          for f in school-app-source.zip source.zip app-source.zip ghiyabat-source.zip; do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done
          if [ -z "$ZIP" ]; then
            for f in *.zip; do
              [ -f "$f" ] || continue
              case "$f" in *QR*|*qr*) continue ;; esac
              ZIP="$f"
              break
            done
          fi
          if [ -z "$ZIP" ]; then
            echo "No source zip found — using repo tree as-is."
            exit 0
          fi
          echo "Extracting $ZIP ..."
          rm -rf _src
          mkdir _src
          unzip -oq "$ZIP" -d _src
          n=$(find _src -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          only=""
          for d in _src/*/; do
            [ -d "$d" ] || continue
            if [ -z "$only" ]; then only="${d%/}"; else only="__multi__"; break; fi
          done
          if [ "$only" = "__multi__" ]; then only=""; fi
          if [ "$n" = "1" ] && [ -n "$only" ] && [ -d "$only" ]; then
            SRC="$only"
            echo "Nested folder detected: $SRC"
          else
            SRC="_src"
            echo "Flat archive"
          fi
          find "$SRC" -mindepth 1 -maxdepth 1 ! -name '.github' ! -name '.git' -print0 | while IFS= read -r -d '' item; do
            base=$(basename "$item")
            rm -rf "./$base"
            mv "$item" "./$base"
          done
          rm -rf _src
          echo "Source extracted. Root contents:"
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Inject repo for auto QR
        run: node tools/inject-repo.js
        env:
          REPO: ${{ github.repository }}

      - name: Install Capacitor and embedded Node runtime
        run: |
          npm install
          npm install https://github.com/hampoelz/capacitor-nodejs/releases/download/v1.0.0-beta.8/capacitor-nodejs.tgz

      - name: Prepare embedded server
        run: |
          node tools/prepare-android.js pre
          cd www/nodejs
          npm install --omit=dev
          cd ../..

      - name: Add Android platform and sync
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Patch Android service
        run: |
          node tools/prepare-android.js post
          npx cap sync android

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ghiyabat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ghiyabat-android
          path: Ghiyabat.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: List artifacts
        run: |
          echo "Artifacts tree:"
          find out -type f -print || true
          test -n "$(find out -name '*.exe' 2>/dev/null)" || { echo "Missing Windows EXE"; exit 1; }
          test -n "$(find out -name 'Ghiyabat.apk' 2>/dev/null)" || { echo "Missing Android APK"; exit 1; }

      - name: Generate QR code for APK download
        env:
          REPO: ${{ github.repository }}
        run: |
          pip install -q "qrcode[pil]"
          python3 - <<'PY'
          import os, qrcode
          url = "https://github.com/%s/releases/latest/download/Ghiyabat.apk" % os.environ["REPO"]
          qr = qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M, box_size=14, border=4)
          qr.add_data(url)
          qr.make(fit=True)
          qr.make_image(fill_color="black", back_color="white").save("Ghiyabat-QR.png")
          print("QR URL:", url)
          PY

      - name: Collect release files
        run: |
          mkdir -p release-files
          # Windows EXE
          find out -name '*.exe' -exec cp -v {} release-files/ \;
          # Android APK (normalize name)
          find out -name 'Ghiyabat.apk' -exec cp -v {} release-files/Ghiyabat.apk \;
          cp -v Ghiyabat-QR.png release-files/
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ghiyabat Build ${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## تحميل تسيير غيابات التلاميذ (Ghiyabat)

            | الملف | الوصف |
            |-------|--------|
            | `Ghiyabat.apk` | تطبيق أندرويد |
            | `Ghiyabat-Setup-*.exe` | مثبت ويندوز |
            | `Ghiyabat-QR.png` | رمز QR للتحميل المباشر للـ APK |

            **رابط التحميل المباشر للـ APK:**
            https://github.com/${{ github.repository }}/releases/latest/download/Ghiyabat.apk

            امسح صورة `Ghiyabat-QR.png` بالكاميرا لتحميل التطبيق مباشرة.
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

